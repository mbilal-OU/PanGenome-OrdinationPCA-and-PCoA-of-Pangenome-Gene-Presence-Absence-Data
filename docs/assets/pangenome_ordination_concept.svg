<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #f8fbff; stroke: #1f4e79; stroke-width: 2; rx: 14; }
      .box2 { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; rx: 14; }
      .box3 { fill: #f0fdf4; stroke: #166534; stroke-width: 2; rx: 14; }
      .box4 { fill: #fdf2f8; stroke: #9d174d; stroke-width: 2; rx: 14; }
      .title { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #111827; }
      .text { font-family: Arial, sans-serif; font-size: 18px; fill: #111827; }
      .small { font-family: Arial, sans-serif; font-size: 15px; fill: #374151; }
      .arrow { stroke: #333; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="600" y="45" text-anchor="middle" class="title">PanGenome-Ordination Concept</text>
  <text x="600" y="75" text-anchor="middle" class="small">From pangenome presence/absence matrix to genome separation and candidate gene drivers</text>

  <rect x="40" y="130" width="230" height="125" class="box"/>
  <text x="155" y="165" text-anchor="middle" class="text">Pangenome matrix</text>
  <text x="155" y="195" text-anchor="middle" class="small">genomes × gene clusters</text>
  <text x="155" y="220" text-anchor="middle" class="small">binary 0/1 presence/absence</text>

  <line x1="270" y1="192" x2="345" y2="192" class="arrow"/>

  <rect x="350" y="130" width="230" height="125" class="box2"/>
  <text x="465" y="165" text-anchor="middle" class="text">Ordination</text>
  <text x="465" y="195" text-anchor="middle" class="small">PCA and Jaccard PCoA</text>
  <text x="465" y="220" text-anchor="middle" class="small">reduce high-dimensional data</text>

  <line x1="580" y1="192" x2="655" y2="192" class="arrow"/>

  <rect x="660" y="130" width="230" height="125" class="box3"/>
  <text x="775" y="165" text-anchor="middle" class="text">Genome separation</text>
  <text x="775" y="195" text-anchor="middle" class="small">clusters, outliers, subgroups</text>
  <text x="775" y="220" text-anchor="middle" class="small">metadata-associated patterns</text>

  <line x1="890" y1="192" x2="965" y2="192" class="arrow"/>

  <rect x="970" y="130" width="190" height="125" class="box4"/>
  <text x="1065" y="165" text-anchor="middle" class="text">Interpretation</text>
  <text x="1065" y="195" text-anchor="middle" class="small">top loadings</text>
  <text x="1065" y="220" text-anchor="middle" class="small">candidate genes</text>

  <rect x="115" y="335" width="290" height="95" class="box"/>
  <text x="260" y="370" text-anchor="middle" class="text">Pangenome summary</text>
  <text x="260" y="400" text-anchor="middle" class="small">core / accessory / cloud gene counts</text>

  <rect x="475" y="335" width="290" height="95" class="box2"/>
  <text x="620" y="370" text-anchor="middle" class="text">Ordination question</text>
  <text x="620" y="400" text-anchor="middle" class="small">how genomes differ by gene content</text>

  <rect x="835" y="335" width="290" height="95" class="box3"/>
  <text x="980" y="370" text-anchor="middle" class="text">Biological hypothesis</text>
  <text x="980" y="400" text-anchor="middle" class="small">candidate accessory gene blocks</text>
</svg>
